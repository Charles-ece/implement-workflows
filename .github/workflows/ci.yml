name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --build build
      - uses: actions/upload-artifact@v3
        with:
          { name: bin, path: build/cpu_monitor_app }  
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v3
      - run: make test
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: ./deploy.sh