name: CI
on:
  push:
    branches: [ main ]
  pull_request: 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - uses: actions/upload-artifact@v3
        with:
          { name: cpu_monitor_app, path: ./cpu_monitor_app }  
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v3
      - run: ./cpu_monitor_app
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "Deploying the application..."